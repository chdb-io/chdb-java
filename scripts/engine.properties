# chDB engine baseline for this Java binding.
#
# Work plan sections 0 and 2: the engine release, its per-platform asset name and the
# SHA-256 of every asset are pinned here. CI must never resolve a "latest" URL.
# Changing engine.version requires a new Maven version and a full four-platform re-test;
# keep this file in sync with <chdb.engine.version> in the root pom.xml.
#
# Checksums are the release asset digests published by GitHub for the tag below
# (gh api repos/chdb-io/chdb-core/releases/tags/v26.7.0 --jq '.assets[].digest').

engine.version=26.7.0
engine.tag=v26.7.0
engine.repo=chdb-io/chdb-core
engine.asset.base=https://github.com/chdb-io/chdb-core/releases/download/v26.7.0

# platform id -> release asset name
asset.macos-aarch64=macos-arm64-libchdb.tar.gz
asset.macos-x86_64=macos-x86_64-libchdb.tar.gz
asset.linux-x86_64-gnu=linux-x86_64-libchdb.tar.gz
asset.linux-aarch64-gnu=linux-aarch64-libchdb.tar.gz

# platform id -> SHA-256 of the release asset
sha256.macos-aarch64=297001823683e8189ba7ab5bb7b47f2e14a2ad2484da222a3da62708d2e7f1c4
sha256.macos-x86_64=5ea7705db21a63b4af7c5bff43e12fdbebe4e6cb459f7335221687493180fbeb
sha256.linux-x86_64-gnu=4ba2b740f2b107be53157d8226cae1edb25b498d69511cdb3c340db3c95c2905
sha256.linux-aarch64-gnu=d934104b492848d2500b48c0a67c580afc50bd968bebbe435c1b13970ef20384

# platform id -> the libchdb file name inside the extracted tarball / the name we ship
libname.macos-aarch64=libchdb.so
libname.macos-x86_64=libchdb.so
libname.linux-x86_64-gnu=libchdb.so
libname.linux-aarch64-gnu=libchdb.so

# platform id -> minimum macOS the shim is built for.
#
# Must not exceed what the engine supports, or the package refuses to load for users in
# between. These are the versions chdb-core's own release wheels declare
# (chdb_core-26.7.0-cp39-abi3-macosx_11_0_arm64.whl and ...-macosx_10_15_x86_64.whl), and
# build-native.sh fails the build if the shim ends up above the engine's.
#
# Left unset, the target follows the build machine's SDK: an unpinned build on a macOS 26
# host produced a shim demanding macOS 26 beside an engine that runs on 11.
#
# The linker clamps upward to the architecture's own minimum, so asking for 10.15 on arm64
# yields 11.0. That is why the two values differ rather than both being 10.15.
deployment.target.macos-aarch64=11.0
deployment.target.macos-x86_64=10.15

# platform id -> the highest glibc the package may require.
#
# Not a target to hit but a ceiling not to exceed: the shim currently lands at 2.25 when built
# in manylinux_2_28, comfortably under. The ceiling is 2.28 because that is the oldest glibc
# still on a supported platform -- RHEL 8 and its rebuilds, maintained to May 2029. Everything
# below it is gone: RHEL 7 (2.17) in June 2024, Amazon Linux 2 (2.26) in June 2026. Everything
# above it is already covered.
#
# Exceeding this means the Linux shim was built outside the manylinux_2_28 container, which is
# how the floor silently became 2.34 once before.
max.glibc.linux-x86_64-gnu=2.28
max.glibc.linux-aarch64-gnu=2.28

# platform id -> the JNI shim file name we build alongside it
jniname.macos-aarch64=libchdb_java_jni.dylib
jniname.macos-x86_64=libchdb_java_jni.dylib
jniname.linux-x86_64-gnu=libchdb_java_jni.so
jniname.linux-aarch64-gnu=libchdb_java_jni.so
